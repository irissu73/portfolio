name: Portfolio Update (Issue -> AI -> projects.json)

on:
  issues:
    types: [labeled]

permissions:
  contents: write
  issues: write

jobs:
  update:
    if: github.event.label.name == 'portfolio-update'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Update projects.json from issue via OpenAI
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_BODY: ${{ github.event.issue.body }}
        run: |
          python scripts/update_projects_from_issue.py

      - name: Commit and push changes
        run: |
          git config user.name "portfolio-bot"
          git config user.email "portfolio-bot@users.noreply.github.com"
          git add projects.json
          git commit -m "Update projects.json from issue" || echo "No changes to commit"
          git push

      - name: Comment summary on Issue
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          REPO: ${{ github.repository }}
        run: |
          gh issue comment "$ISSUE_NUMBER" --repo "$REPO" --body "✅ 已完成自動更新並推送到 GitHub（projects.json）。接下來 Vercel 會自動部署，網站內容將更新。"

      - name: Close Issue
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          REPO: ${{ github.repository }}
        run: |
          gh issue close "$ISSUE_NUMBER" --repo "$REPO" --comment "🔒 此次更新流程已完成，先自動關閉本 Issue。"