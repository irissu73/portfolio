<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <title>IRIS ｜ AI 實驗場</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

<!-- Header 保留你的 -->
<header>
  <h1>IRIS ｜ AI 實驗場</h1>
  <p>用專案實驗 AI 的各種可能性</p>
  <p>Build. Test. Expand with AI.</p>
</header>

<div class="layout">
  <!-- Sidebar -->
  <aside id="sidebar" class="sidebar">
    <div class="sidebar-header">
      <div class="sidebar-title">篩選</div>
      <button id="sidebarToggle" class="sidebar-toggle" aria-label="toggle sidebar">
        ⟨
      </button>
    </div>

    <h2 id="project-count" class="project-count"></h2>

    <div class="filter-block">
      <div class="filter-title">狀態</div>
      <div id="status-filters" class="filter-chips"></div>
    </div>

    <div class="filter-block">
      <div class="filter-title">實驗方向</div>
      <div id="direction-filters" class="filter-chips"></div>
    </div>

    <div class="filter-block">
      <div class="filter-title">技術</div>
      <div id="tech-filters" class="filter-chips"></div>
    </div>
  </aside>

  <!-- Main -->
  <main class="main">
    <section id="project-list" class="project-grid"></section>
  </main>
</div>

  <script src="./main.js"></script>
</body>
</html>
