<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>IRIS ｜ AI 實驗場</title>

  <link rel="icon" href="./favicon.png" />
  <link rel="stylesheet" href="./style.css?v=base09" />
</head>

<body>
  <!-- Top bar -->
  <header class="topbar">
    <button id="menuBtn" class="icon-btn" aria-label="打開篩選">☰</button>

    <div class="brand">
      <div class="brand-title">IRIS ｜ AI 實驗場</div>
      <div class="brand-sub">用專案實驗 AI 的各種可能性</div>
      <div class="brand-sub en">Build. Test. Expand with AI.</div>
    </div>
  </header>

  <!-- Drawer + overlay -->
  <div id="overlay" class="overlay"></div>

  <aside id="drawer" class="drawer" aria-hidden="true">
    <div class="drawer-head">
      <div class="drawer-title">篩選</div>
      <div class="drawer-actions">
        <button id="clearFiltersBtn" class="tag ghost">清除</button>
        <button id="closeDrawerBtn" class="tag ghost">✕</button>
      </div>
    </div>

    <div class="drawer-body">
      <div class="drawer-section">
        <div class="drawer-section-title">實驗方向</div>
        <div id="directionTags" class="tag-list"></div>
      </div>

      <div class="drawer-section">
        <div class="drawer-section-title">技術</div>
        <div id="techTags" class="tag-list"></div>
      </div>
    </div>

    <!-- footer 不固定（你選 B），內容多會自然捲動 -->
  </aside>

  <!-- Page -->
  <main class="page">
    <!-- 狀態列（固定在主頁） -->
    <section class="status-row">
      <h2 id="project-count" class="project-count">Projects</h2>
      <div id="status-filters" class="status-chips"></div>
    </section>

    <!-- 若 JS 沒跑才會看到；JS 成功後會自動移除 -->
    <div id="js-warning" class="warn">
      ⚠️ JS 尚未載入或執行失敗（請檢查 main.js / projects.json 路徑與格式）
    </div>

    <!-- 卡片列表 -->
    <section id="project-list" class="project-grid"></section>
  </main>

  <!-- to top -->
  <button id="toTopBtn" class="to-top" aria-label="回到頂部">↑</button>

  <script src="./main.js?v=home09"></script>
</body>
</html>
