<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>IRIS ｜ AI 實驗場</title>
  <link rel="icon" type="image/png" href="/favicon.png" />
  <link rel="shortcut icon" href="/favicon.png">
  <link rel="apple-touch-icon" href="/favicon.png" />
  <link rel="stylesheet" href="./style.css?v=app03" />
</head>
<body>

<header class="topbar">
  <button id="menuBtn" class="icon-btn">☰</button>
  <div class="brand">
    <h1>IRIS ｜ AI 實驗場</h1>
    <p>用專案實驗 AI 的各種可能性</p>
    <p>Build. Test. Expand with AI.</p>
  </div>
</header>

<div id="overlay" class="overlay hidden"></div>

<!-- Drawer -->
<aside id="drawer" class="drawer ios-drawer" aria-hidden="true">
  <div class="drawer-header ios-header">
    <div class="drawer-title ios-title">篩選</div>
    <div class="drawer-header-actions">
      <button id="clearFilters" class="ios-clear">清除</button>
      <button id="closeBtn" class="ios-close">✕</button>
    </div>
  </div>

  <div class="drawer-scroll ios-scroll">
    <div class="ios-section">
      <div class="ios-section-title">實驗方向</div>
      <div id="direction-filters" class="ios-list"></div>
    </div>

    <div class="ios-section">
      <div class="ios-section-title">技術</div>
      <div id="tech-filters" class="ios-list"></div>
    </div>
  </div>
</aside>

<main class="page">
  <div class="status-row">
    <h2 id="project-count" class="project-count"></h2>
    <div id="status-filters" class="status-chips"></div>
  </div>

  <section id="project-list"></section>
</main>

<script src="./main.js?v=app02"></script>
<button id="backToTop" class="back-to-top">↑</button>
</body>
</html>
