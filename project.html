<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <title>Project | IRIS ｜ AI 實驗場</title>

  <link rel="icon" type="image/png" href="/favicon.png" />
  <link rel="stylesheet" href="./style.css?v=base01">
  <link rel="stylesheet" href="./project.css?v=detail01">
</head>
<body>

  <!-- 簡單頂部（不依賴首頁 drawer） -->
  <header style="max-width:920px;margin:0 auto;padding:14px 16px;display:flex;gap:12px;align-items:center;">
    <a href="./index.html" style="text-decoration:none;font-weight:900;border:1px solid rgba(0,0,0,.12);background:#fff;border-radius:12px;padding:10px 12px;color:#111;">←</a>
    <div style="line-height:1.1">
      <div style="font-weight:900;">IRIS ｜ AI 實驗場</div>
      <div style="font-size:12px;color:#666;margin-top:4px;">用專案實驗 AI 的各種可能性</div>
    </div>
  </header>

  <main class="project-page">
    <div id="projectRoot"></div>

    <div id="notFound" class="hidden" style="max-width:920px;margin:0 auto;padding:0 16px;">
      <div class="section">
        <h2 class="section-title">找不到這個專案</h2>
        <div class="prose muted">請確認網址帶有 id，例如：project.html?id=littlehq</div>
        <div class="bottom-actions" style="margin-top:14px;">
          <a class="btn" href="./index.html">回到首頁</a>
        </div>
      </div>
    </div>
  </main>

  <script>
    // ---------- helpers ----------
    const $ = (sel) => document.querySelector(sel);

    function getId() {
      const u = new URL(location.href);
      return u.searchParams.get("id");
    }

    function escapeHtml(s) {
      return String(s ?? "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#39;");
    }

    function statusMeta(status) {
      const map = {
        concept:   { dot: "🟡", zh: "構想期" },
        testing:   { dot: "🟠", zh: "驗證中" },
        validated: { dot: "🟢", zh: "已驗證" },
        expanding: { dot: "🔵", zh: "延伸中" },
      };
      return map[status] || { dot: "⚪️", zh: "未分類" };
    }

    function pills(tags) {
      if (!Array.isArray(tags) || tags.length === 0) return `<span class="muted">尚未標記</span>`;
      return tags.map(t => `<span class="pill">${escapeHtml(t)}</span>`).join("");
    }

    // ---------- render ----------
    async function run() {
      const id = getId();
      if (!id) {
        $("#notFound").classList.remove("hidden");
        return;
      }

      let data;
      try {
        const res = await fetch("./projects.json?v=" + Date.now());
        data = await res.json();
      } catch (e) {
        $("#notFound").classList.remove("hidden");
        return;
      }

      const projects = Array.isArray(data) ? data : (data.projects || []);
      const p = projects.find(x => String(x.id) === String(id));

      if (!p) {
        $("#notFound").classList.remove("hidden");
        return;
      }

      const meta = statusMeta(p.status);
      const updated = (p.updatedAt || "").replace("-", ".");
      const cover = p.cover || "";
      const title = p.title || "";
      const output = p.output || "";
      const summary = p.summary || "";
      const description = p.description || ""; // 你想寫完整內容就放這欄（可多段落換行）

      const directionTags = p.directionTags || [];
      const techTags = p.techTags || [];

      // 成果展示：支援 demoUrl + images[]
      const demoUrl = p.demoUrl || "";
      const images = Array.isArray(p.images) ? p.images : [];

      // 時間軸：支援 timeline: [{date, text}]
      const timeline = Array.isArray(p.timeline) ? p.timeline : [];

      const coverHtml = cover
        ? `<img class="project-cover" src="${escapeHtml(cover)}" alt="${escapeHtml(title)}" onerror="this.remove()">`
        : "";

      const galleryHtml = (demoUrl || images.length)
        ? `
          <section class="section">
            <h2 class="section-title">成果展示</h2>
            ${demoUrl ? `<a class="btn primary" href="${escapeHtml(demoUrl)}" target="_blank" rel="noopener">開啟 Demo</a>` : ""}
            ${images.length ? `
              <div class="gallery">
                ${images.map(src => `<img class="gallery-img" src="${escapeHtml(src)}" alt="成果圖片" onerror="this.remove()">`).join("")}
              </div>
            ` : ""}
          </section>
        `
        : "";

      const timelineHtml = timeline.length
        ? `
          <section class="section">
            <h2 class="section-title">開發時間軸</h2>
            <div class="timeline">
              ${timeline.map(item => `
                <div class="timeline-item">
                  <div class="timeline-date">${escapeHtml(item.date || "")}</div>
                  <div class="timeline-text">${escapeHtml(item.text || "")}</div>
                </div>
              `).join("")}
            </div>
          </section>
        `
        : "";

      $("#projectRoot").innerHTML = `
        ${coverHtml}

        <div class="project-hero">
          <div class="project-meta">
            <span class="meta-dot">${meta.dot}</span>
            <span class="meta-text">${meta.zh}</span>
            <span class="meta-sep">｜</span>
            <span class="meta-updated">更新 ${escapeHtml(updated)}</span>
          </div>

          <h1 class="project-title">${escapeHtml(title)}</h1>

          ${summary ? `<p class="project-lead">${escapeHtml(summary)}</p>` : ""}

          ${output ? `<div class="project-output">產出：<strong>${escapeHtml(output)}</strong></div>` : ""}
        </div>

        <section class="section">
          <h2 class="section-title">專案內容</h2>
          ${
            description
              ? `<div class="prose">${escapeHtml(description).replaceAll("\n", "<br>")}</div>`
              : `<div class="prose muted">（把你的完整內容放在 projects.json 的 description 欄位，支援換行。）</div>`
          }
        </section>

        <section class="section">
          <h2 class="section-title">實驗方向</h2>
          <div class="pill-row">${pills(directionTags)}</div>
        </section>

        <section class="section">
          <h2 class="section-title">技術</h2>
          <div class="pill-row">${pills(techTags)}</div>
        </section>

        ${galleryHtml}
        ${timelineHtml}

        <div class="bottom-actions">
          <a class="btn" href="./index.html">回到首頁</a>
        </div>
      `;
    }

    run();
  </script>

</body>
</html>
