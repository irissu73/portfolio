<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Project | IRIS AI 實驗場</title>
  <link rel="stylesheet" href="./style.css?v=base01">
  <link rel="stylesheet" href="./project.css?v=detail01">
</head>
<body>

<header class="topbar">
  <a class="icon-btn" href="./index.html" aria-label="Back">←</a>
  <div class="brand">
    <h1 id="detail-title">專案明細</h1>
    <p id="detail-sub">IRIS ｜ AI 實驗場</p>
  </div>
</header>

<main class="project-page">
  <div id="detail" class="detail-wrap">
    <div class="detail-loading">載入中…</div>
  </div>
</main>

<script>
  const $ = (id) => document.getElementById(id);

  function statusLabel(status){
    return ({
      concept: "🟡 構想中",
      testing: "🟠 驗證中",
      validated: "🟢 已驗證",
      expanding: "🔵 延伸中"
    })[status] || status;
  }

  function getParam(name){
    const u = new URL(location.href);
    return u.searchParams.get(name);
  }

  function escapeHtml(s){
    return String(s ?? "")
      .replaceAll("&","&amp;")
      .replaceAll("<","&lt;")
      .replaceAll(">","&gt;")
      .replaceAll('"',"&quot;")
      .replaceAll("'","&#039;");
  }

  const id = getParam("id");

  fetch("./projects.json")
    .then(r => r.json())
    .then(data => {
      const projects = data.projects || [];
      const p = projects.find(x => x.id === id);

      if(!p){
        $("detail").innerHTML = `
          <div class="detail-card">
            <h2>找不到此專案</h2>
            <p>可能是網址 id 不存在，或 projects.json 尚未加入 id。</p>
            <p><a class="detail-link" href="./index.html">回首頁 →</a></p>
          </div>
        `;
        return;
      }

      $("detail-title").textContent = p.title || "專案明細";
      $("detail-sub").textContent = `${statusLabel(p.status)} ｜ 更新 ${p.updatedAt || ""}`;

      const coverHtml = p.cover
        ? `<img class="detail-cover" src="${escapeHtml(p.cover)}" onerror="this.remove()">`
        : "";

      const dirTags = (p.directionTags || []).map(t => `<span>${escapeHtml(t)}</span>`).join("");
      const techTags = (p.techTags || []).map(t => `<span>${escapeHtml(t)}</span>`).join("");

      const timeline = (p.timeline || []);
      const timelineHtml = timeline.length
        ? timeline.map(item => `
            <div class="timeline-item">
              <div class="timeline-date">${escapeHtml(item.date || "")}</div>
              <div class="timeline-body">
                <div class="timeline-title">${escapeHtml(item.title || "")}</div>
                <div class="timeline-note">${escapeHtml(item.note || "")}</div>
              </div>
            </div>
          `).join("")
        : `<div class="muted">（尚未建立時間軸）</div>`;

      $("detail").innerHTML = `
        <div class="detail-card">
          ${coverHtml}

          <div class="detail-section">
            <div class="detail-kv">
              <div class="detail-k">狀態</div>
              <div class="detail-v">${statusLabel(p.status)}</div>
            </div>
            <div class="detail-kv">
              <div class="detail-k">更新</div>
              <div class="detail-v">${escapeHtml(p.updatedAt || "")}</div>
            </div>
            <div class="detail-kv">
              <div class="detail-k">產出</div>
              <div class="detail-v">${escapeHtml(p.output || "")}</div>
            </div>
          </div>

          <div class="detail-section">
            <h2>摘要</h2>
            <p>${escapeHtml(p.summary || "")}</p>
          </div>

          <div class="detail-section">
            <h2>標籤</h2>
            <div class="tags">${dirTags}</div>
          </div>

          <div class="detail-section">
            <h2>技術</h2>
            <div class="tags">${techTags}</div>
          </div>

          <div class="detail-section">
            <h2>推進時間軸</h2>
            <div class="timeline">${timelineHtml}</div>
          </div>

          <div class="detail-section">
            <a class="detail-link" href="./index.html">回首頁 →</a>
          </div>
        </div>
      `;
    })
    .catch(err => {
      $("detail").innerHTML = `
        <div class="detail-card">
          <h2>載入失敗</h2>
          <p class="muted">${escapeHtml(String(err))}</p>
          <p><a class="detail-link" href="./index.html">回首頁 →</a></p>
        </div>
      `;
      console.error(err);
    });
</script>
</body>
</html>
